name: Trainingsdaten synchronisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garmin-Token-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            sync/.garmin_tokens
            sync/.renpho_session.enc.json
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Abhaengigkeiten installieren
        run: pip install -r sync/requirements.txt

      - name: Sync ausfuehren
        working-directory: sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
          HEALTH_BRIDGE_URL: ${{ secrets.HEALTH_BRIDGE_URL }}
          HEALTH_BRIDGE_TOKEN: ${{ secrets.HEALTH_BRIDGE_TOKEN }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py

      - name: Telegram-Nachrichten (Zeiten stellt Willi auf der Website ein)
        working-directory: sync
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: python telegram_agenda.py auto

      - name: Verschluesselte Daten committen
        run: |
          git config user.name "basis-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/training-data.enc.json
          if [ -f data/plan.enc.json ]; then git add data/plan.enc.json; fi
          if [ -f data/telegram-state.json ]; then git add data/telegram-state.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Automatischer Trainingsdaten-Sync"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase -X ours origin/main
          done
          git push
