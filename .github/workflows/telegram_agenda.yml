name: Telegram Tagesagenda

on:
  # Zeitgesteuerte Nachrichten laufen jetzt im Sync-Workflow (sync.yml, alle 10 Minuten);
  # die Uhrzeiten stellt Willi auf der Website ein. Dieser Workflow ist nur fuer Sofort-Tests.
  workflow_dispatch:
    inputs:
      mode:
        description: "morning, evening oder weekly (sendet sofort)"
        default: "morning"

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modus bestimmen
        id: mode
        run: echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"

      - name: Nachricht senden
        working-directory: sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: |
          pip install requests cryptography --quiet
          python telegram_agenda.py "${{ steps.mode.outputs.mode }}"
