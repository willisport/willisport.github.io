<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Willis Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Willis Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20260922b">
</head>
<body>

<div class="shell">

  <nav class="sidenav" aria-label="Hauptnavigation">
    <div class="brand">
      <span class="brand-name">Willis Dashboard</span>
    </div>

    <div class="mode-switch" id="mode-switch" hidden>
      <button class="mode-btn is-active" data-mode="sport">Sport</button>
      <button class="mode-btn" data-mode="iris">✺ Iris</button>
    </div>

    <div class="sport-nav" id="sport-nav">
      <button class="nav-item is-active" data-tab="heute">
        <span class="nav-icon" aria-hidden="true">◐</span><span>Heute</span>
      </button>
      <button class="nav-item" data-tab="woche">
        <span class="nav-icon" aria-hidden="true">▦</span><span>Woche</span>
      </button>
      <button class="nav-item" data-tab="verlauf">
        <span class="nav-icon" aria-hidden="true">↺</span><span>Verlauf</span>
      </button>
      <button class="nav-item" data-tab="performance">
        <span class="nav-icon" aria-hidden="true">⤴</span><span>Performance</span>
      </button>
      <button class="nav-item" data-tab="coach">
        <span class="nav-icon" aria-hidden="true">◆</span><span>Coach</span>
      </button>
      <button class="nav-item" data-tab="kraft">
        <span class="nav-icon" aria-hidden="true">💪</span><span>Kraft</span>
      </button>
      <button class="nav-item" data-tab="planaenderungen">
        <span class="nav-icon" aria-hidden="true">✎</span><span>Anfragen</span>
      </button>
      <button class="nav-item" data-tab="logins" hidden>
        <span class="nav-icon" aria-hidden="true">🔑</span><span>Logins</span>
      </button>
    </div>

    <div class="sidenav-footer">
      <span class="role-chip" id="role-chip" hidden></span>
      <div class="goal-text" id="sidenav-goal" hidden></div>
    </div>
  </nav>

  <main class="content">

    <section class="tab-panel is-active" id="tab-heute" data-tab-panel="heute"></section>
    <section class="tab-panel" id="tab-woche" data-tab-panel="woche"></section>
    <section class="tab-panel" id="tab-verlauf" data-tab-panel="verlauf"></section>
    <section class="tab-panel" id="tab-performance" data-tab-panel="performance"></section>
    <section class="tab-panel" id="tab-coach" data-tab-panel="coach"></section>
    <section class="tab-panel" id="tab-kraft" data-tab-panel="kraft"></section>
    <section class="tab-panel" id="tab-planaenderungen" data-tab-panel="planaenderungen"></section>
    <section class="tab-panel" id="tab-logins" data-tab-panel="logins"></section>
    <section class="tab-panel" id="tab-iris" data-tab-panel="iris"></section>

  </main>

  <nav class="bottomnav" aria-label="Hauptnavigation mobil">
    <div class="mode-switch mode-switch-mobile" id="mode-switch-mobile" hidden>
      <button class="mode-btn is-active" data-mode="sport">Sport</button>
      <button class="mode-btn" data-mode="iris">✺ Iris</button>
    </div>
    <div class="bottomnav-row" id="bottomnav-row">
      <button class="bn-item is-active" data-tab="heute"><span class="nav-icon" aria-hidden="true">◐</span><span>Heute</span></button>
      <button class="bn-item" data-tab="woche"><span class="nav-icon" aria-hidden="true">▦</span><span>Woche</span></button>
      <button class="bn-item" data-tab="verlauf"><span class="nav-icon" aria-hidden="true">↺</span><span>Verlauf</span></button>
      <button class="bn-item" data-tab="performance"><span class="nav-icon" aria-hidden="true">⤴</span><span>Perf.</span></button>
      <button class="bn-item" data-tab="coach"><span class="nav-icon" aria-hidden="true">◆</span><span>Coach</span></button>
      <button class="bn-item" data-tab="kraft"><span class="nav-icon" aria-hidden="true">💪</span><span>Kraft</span></button>
      <button class="bn-item" data-tab="planaenderungen"><span class="nav-icon" aria-hidden="true">✎</span><span>Anfragen</span></button>
      <button class="bn-item" data-tab="logins" hidden><span class="nav-icon" aria-hidden="true">🔑</span><span>Logins</span></button>
    </div>
  </nav>

</div>

<button id="sync-btn" class="sync-btn" title="Garmin &amp; Waage jetzt synchronisieren">
  <span class="icon">⟳</span><span id="sync-btn-label">Synchronisieren</span>
</button>
<button id="hosted-sync-btn" class="sync-btn" hidden title="Garmin &amp; Waage jetzt synchronisieren">
  <span class="icon">⟳</span><span>Sync auslösen</span>
</button>
<div id="sync-panel" class="sync-panel" hidden></div>
<div id="sync-status" class="sync-status" hidden></div>

<script src="js/auth.js?v=20260922b"></script>
<script src="js/app.js?v=20260922b"></script>
</body>
</html>
